name: Build and publish release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build macOS ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - arch: arm64
            runner: macos-14
          - arch: x64
            runner: macos-13
    steps:
      - uses: actions/checkout@v4
      - name: Build app
        run: bash scripts/make_app.sh
      - name: Package app
        run: ditto -c -k --sequesterRsrc --keepParent build/AgentNotify.app AgentNotify-macos-${{ matrix.arch }}.zip
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: AgentNotify-macos-${{ matrix.arch }}
          path: AgentNotify-macos-${{ matrix.arch }}.zip

  release:
    name: Create GitHub release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Create release and upload assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" release-assets/*.zip --repo "${GITHUB_REPOSITORY}" --title "${GITHUB_REF_NAME}" --generate-notes
